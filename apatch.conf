[apatch]
downloads_dir = ~/Downloads
state_file = apply_patch.state.json
applied_patches_file = applied_patches.txt
log_directory = logs
remote = origin
base_branch = main
require_review_approval = true
require_required_checks = true
require_patch_feature_branch = false
merge_method = merge
max_uncompressed_patch_bytes = 52428800
github_timeout_seconds = 30
check_timeout_seconds = 900
check_idle_timeout_seconds = 30
progress_global_limit = 8
progress_project_limit = 3
