[apatch]
downloads_dir = ~/Downloads
state_file = signalharvester_apply_patch.state.json
log_directory = logs
applied_patches_file = signalharvester_applied_patches.txt
remote = origin
base_branch = main
check_command = ./run_checks.sh
extra_check_commands_json = []
require_review_approval = true
require_required_checks = true
merge_method = merge
max_uncompressed_patch_bytes = 52428800
